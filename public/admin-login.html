```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | The Potter's House Church</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 20% 20%, rgba(139,92,246,.25), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(59,130,246,.20), transparent 35%),
                #050505;
            color: white;
        }

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .35;
            animation: float 8s ease-in-out infinite;
        }

        .orb.one {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            left: -100px;
            top: -80px;
        }

        .orb.two {
            width: 260px;
            height: 260px;
            background: #2563eb;
            right: -80px;
            bottom: -60px;
            animation-delay: -3s;
        }

        .orb.three {
            width: 180px;
            height: 180px;
            background: #ec4899;
            right: 20%;
            top: 10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0%,100% {
                transform: translate(0,0) scale(1);
            }

            50% {
                transform: translate(30px,-25px) scale(1.1);
            }
        }

        .login-container {
            width: min(430px, calc(100% - 32px));
            position: relative;
            z-index: 5;
            animation: appear .8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            padding: 42px 34px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 28px;
            background: rgba(15,15,20,.78);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 30px 80px rgba(0,0,0,.55),
                inset 0 1px rgba(255,255,255,.08);
        }

        .logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,#8b5cf6,#2563eb);
            box-shadow: 0 15px 40px rgba(124,58,237,.35);
            font-size: 30px;
            font-weight: 800;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #a1a1aa;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #d4d4d8;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #27272a;
            outline: none;
            border-radius: 14px;
            padding: 0 16px;
            background: #09090b;
            color: white;
            font-size: 15px;
            transition: .25s;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,.15);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #a1a1aa;
            cursor: pointer;
            font-size: 13px;
        }

        .login-button {
            width: 100%;
            height: 54px;
            margin-top: 8px;
            border: 0;
            border-radius: 15px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg,#7c3aed,#2563eb);
            transition: .25s;
            box-shadow: 0 12px 30px rgba(79,70,229,.25);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 35px rgba(79,70,229,.35);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.25);
            color: #fca5a5;
        }

        .message.success {
            display: block;
            background: rgba(34,197,94,.12);
            border: 1px solid rgba(34,197,94,.25);
            color: #86efac;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #71717a;
            font-size: 12px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 7px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media(max-width:500px) {
            .login-card {
                padding: 34px 24px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            PH
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            The Potter's House Church Bengaluru
        </p>

        <form id="loginForm">

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                    >
                        Show
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login to Dashboard
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>

        <div class="footer">
            © 2026 The Potter's House Church Bengaluru
        </div>

    </div>

</div>

<script>
const form =
    document.getElementById("loginForm");

const username =
    document.getElementById("username");

const password =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");


/* =========================================
   PASSWORD SHOW / HIDE
========================================= */

togglePassword.addEventListener(
    "click",
    () => {

        if (
            password.type === "password"
        ) {

            password.type = "text";

            togglePassword.textContent =
                "Hide";

        } else {

            password.type = "password";

            togglePassword.textContent =
                "Show";
        }
    }
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        showMessage(
            "",
            ""
        );

        loginButton.disabled = true;

        loginButton.innerHTML =
            '<span class="spinner"></span>Logging in...';

        try {

            const response =
                await fetch(
                    "/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                username:
                                    username.value.trim(),

                                password:
                                    password.value
                            })
                    }
                );

            const data =
                await response.json();

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Invalid username or password."
                );
            }

            showMessage(
                "Login successful. Opening dashboard...",
                "success"
            );

            setTimeout(
                () => {

                    window.location.href =
                        "/admin";

                },
                700
            );

        } catch (error) {

            showMessage(
                error.message ||
                "Login failed.",
                "error"
            );

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login to Dashboard";
        }
    }
);


/* =========================================
   CHECK EXISTING SESSION
========================================= */

async function checkLogin() {

    try {

        const response =
            await fetch(
                "/api/admin/me",
                {
                    credentials:
                        "include"
                }
            );

        const data =
            await response.json();

        if (
            data.success &&
            data.authenticated
        ) {

            window.location.href =
                "/admin";
        }

    } catch (error) {

        console.log(
            "Session check skipped."
        );
    }
}

checkLogin();
</script>

</body>
</html>
