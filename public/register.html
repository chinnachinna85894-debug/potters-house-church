<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Potter's House</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #222,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #1b1b1b,
                    transparent 35%
                ),
                #000;

            color: #fff;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .container {

            width: 100%;

            max-width: 430px;
        }

        .logo {

            width: 80px;

            height: 80px;

            border: 2px solid #fff;

            border-radius: 50%;

            margin: 0 auto 22px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 36px;
        }

        .title {

            text-align: center;

            margin-bottom: 8px;

            font-size: 28px;

            font-weight: 700;
        }

        .subtitle {

            text-align: center;

            color: #aaa;

            margin-bottom: 30px;

            font-size: 14px;
        }

        .card {

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid rgba(255,255,255,0.13);

            border-radius: 18px;

            padding: 30px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border: 1px solid #333;

            background: #111;

            color: #fff;

            outline: none;

            font-size: 15px;
        }

        input:focus {

            border-color: #fff;
        }

        button {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #fff;

            color: #000;

            font-weight: 700;

            font-size: 15px;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {

            background: #ddd;

            transform: translateY(-1px);
        }

        .secondary {

            background: transparent;

            color: #fff;

            border: 1px solid #444;

            margin-top: 10px;
        }

        .secondary:hover {

            background: #181818;
        }

        .message {

            display: none;

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }

        .success {

            display: block;

            background: #123b20;

            border: 1px solid #276b3a;

            color: #9cffb3;
        }

        .error {

            display: block;

            background: #3b1212;

            border: 1px solid #6b2727;

            color: #ff9c9c;
        }

        .hidden {

            display: none;
        }

        .info {

            color: #999;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;

            margin-bottom: 20px;
        }

        @media (max-width: 500px) {

            .card {
                padding: 22px;
            }

            .title {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

<div class="container">





    <div class="logo">
    <img src="./potters_house_logo_transparent_no_shadow.png"The Potter's House Logo">
</div>



<style>
.logo {
    width: 105px;
    height: 105px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo img {
    width: 100%;
    height: 200px;
    object-fit: contain;
    display: block;
}
</style>






    <h1 class="title">
        The Potter's House
    </h1>

    <p class="subtitle">
        Create Account
    </p>


    <!-- REGISTER -->

    <div class="card" id="registerBox">

        <div
            id="registerMessage"
            class="message"
        ></div>

        <form id="registerForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button type="submit">
                Create Account
            </button>

        </form>


        <button
            type="button"
            class="secondary"
            onclick="window.location.href='/login.html'"
        >
            Back to Login
        </button>

    </div>


    <!-- OTP -->

    <div
        class="card hidden"
        id="otpBox"
    >

        <div
            id="otpMessage"
            class="message"
        ></div>

        <h2
            style="
                text-align:center;
                margin-bottom:12px;
            "
        >
            Verify Email
        </h2>

        <p class="info">
            We sent a 6-digit verification code
            to your email address.
        </p>


        <div class="form-group">

            <label for="otp">
                Verification OTP
            </label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                placeholder="Enter 6 digit OTP"
            >

        </div>


        <button
            type="button"
            onclick="verifyOTP()"
        >
            Verify Email
        </button>


        <button
            type="button"
            class="secondary"
            onclick="resendOTP()"
        >
            Resend OTP
        </button>


        <button
            type="button"
            class="secondary"
            onclick="showRegister()"
        >
            Change Email
        </button>

    </div>

</div>


<script>

    let registeredEmail = "";


    function showMessage(
        id,
        message,
        type
    ) {

        const element =
            document.getElementById(id);

        element.textContent = message;

        element.className =
            "message " + type;
    }


    function showRegister() {

        document
            .getElementById("registerBox")
            .classList.remove("hidden");

        document
            .getElementById("otpBox")
            .classList.add("hidden");
    }


    /* ==========================
       REGISTER
       ========================== */

    document
        .getElementById("registerForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                if (password.length < 6) {

                    showMessage(
                        "registerMessage",
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    return;
                }


                if (password !== confirmPassword) {

                    showMessage(
                        "registerMessage",
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        showMessage(
                            "registerMessage",
                            data.message ||
                            "Registration failed.",
                            "error"
                        );

                        return;
                    }


                    registeredEmail = email;


                    showMessage(
                        "registerMessage",
                        "OTP sent to your email.",
                        "success"
                    );


                    setTimeout(function() {

                        document
                            .getElementById("registerBox")
                            .classList.add("hidden");

                        document
                            .getElementById("otpBox")
                            .classList.remove("hidden");

                    }, 700);


                } catch (error) {

                    console.error(error);

                    showMessage(
                        "registerMessage",
                        "Unable to connect to server.",
                        "error"
                    );
                }

            }
        );


    /* ==========================
       VERIFY OTP
       ========================== */

    async function verifyOTP() {

        const otp =
            document
                .getElementById("otp")
                .value
                .trim();


        if (otp.length !== 6) {

            showMessage(
                "otpMessage",
                "Please enter the 6-digit OTP.",
                "error"
            );

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/auth/verify-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            email: registeredEmail,
                            otp: otp
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    "otpMessage",
                    data.message ||
                    "Invalid OTP.",
                    "error"
                );

                return;
            }


            showMessage(
                "otpMessage",
                "Email verified successfully. Opening login...",
                "success"
            );


            setTimeout(function() {

                window.location.replace(
                    "/login.html"
                );

            }, 1000);


        } catch (error) {

            console.error(error);

            showMessage(
                "otpMessage",
                "Unable to connect to server.",
                "error"
            );
        }
    }


    /* ==========================
       RESEND OTP
       ========================== */

    async function resendOTP() {

        if (!registeredEmail) {

            showRegister();

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/auth/resend-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            email: registeredEmail
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    "otpMessage",
                    data.message ||
                    "Could not resend OTP.",
                    "error"
                );

                return;
            }


            showMessage(
                "otpMessage",
                "New OTP sent successfully.",
                "success"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "otpMessage",
                "Unable to connect to server.",
                "error"
            );
        }
    }

</script>

</body>
</html>
